[project]
name = "assignment"
version = "0.1.0"
description = "Fuel optimised route planning API for the USA"
readme = "README.md"
authors = [
    { name = "Sai", email = "sai@everflourish.in" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "geonamescache>=3.0.2",
    "requests>=2.34.2",
]

[project.scripts]
assignment = "assignment:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
